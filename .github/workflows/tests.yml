name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Filament release that the built theme doesn't match shows up here first.
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest

  theme:
    runs-on: ubuntu-latest
    name: Pint and built theme

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: composer update --prefer-dist --no-interaction

      - name: Pint
        run: vendor/bin/pint --test

      - name: Built theme matches kinetics.css and the latest Filament
        run: |
          npm install
          npm run build
          git diff --exit-code resources/dist
