name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new Filament, Laravel or PHP release that breaks installs shows up here first.
    - cron: '0 6 * * 1'

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        filament: ['^5.8.3']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
          # Filament 4, on the Laravel it supports.
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^4.13.3'
            stability: prefer-lowest
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            filament: '^4.13.3'
            stability: prefer-stable

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest

  quality:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl
          coverage: none

      - run: composer update --prefer-dist --no-interaction

      - name: Pint
        run: vendor/bin/pint --test
